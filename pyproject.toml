# repo 全体の python 入口 (issue #5 の連携経路)。examples/ のスクリプトを
# `uv run examples/hello.py` で動かすための仮想プロジェクト ([build-system] 無し =
# パッケージ化せず依存だけ .venv に入れる。sandbox-openmc/pyproject.toml と同じ方式)。
# stellarator は path 依存で、uv が maturin 経由で pyo3 拡張をビルドする。
# openmc-pypi は自前 index (lzpel/openmc-pypi の GitHub Pages) から。
# cad-to-dagmc は PyPI (OCCT は cadquery-ocp wheel が同梱してくる)。
[project]
name = "mhd-tbr-stell"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["stellarator", "openmc-pypi", "cad-to-dagmc"]

[tool.uv.sources]
stellarator = { path = "./stellarator" }
openmc-pypi = { index = "openmc-pypi" }

[[tool.uv.index]]
name = "openmc-pypi"
url = "https://lzpel.github.io/openmc-pypi/wheel/"

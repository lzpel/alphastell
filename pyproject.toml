# repo 全体の python 入口 (issue #5 の連携経路)。examples/ のスクリプトを
# `make al-00` (= uv run examples/al_00_hello.py) で動かすための仮想プロジェクト ([build-system] 無し =
# パッケージ化せず依存だけ .venv に入れる。sandbox-openmc/pyproject.toml と同じ方式)。
# stellarator は path 依存で、uv が maturin 経由で pyo3 拡張をビルドする。
# openmc-anywhere は PyPI (sandbox-openmc/pyproject.toml と同じ wheel)。
# cad-to-dagmc は PyPI (OCCT は cadquery-ocp wheel が同梱してくる)。
[project]
name = "mhd-tbr-stell"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["stellarator", "openmc-anywhere>=0.15.3.0", "cad-to-dagmc", "matplotlib"]

[tool.uv.sources]
stellarator = { path = "./stellarator" }

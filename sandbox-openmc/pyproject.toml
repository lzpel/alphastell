# transport と njoy を openmc/openmc docker イメージではなく PyPI 公開の
# openmc-anywhere wheel で回す (issue #16)。[build-system] を書かない = uv は
# これを仮想プロジェクトとして扱い、依存だけを .venv に入れる (スクリプト集なので十分)。
# numpy/matplotlib は scripts/ が直接 import するので transitive に頼らず明示する。
[project]
name = "sandbox-openmc"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
 "numpy",
 "matplotlib",
 "openmc-anywhere>=0.15.3.0",
]

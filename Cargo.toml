[package]
name = "alphastell"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Satoshi Misumi"]
description = "Rust CAD generator for stellarator fusion reactors: VMEC equilibria to STEP geometry for in-vessel layers and modular coils."
readme = "README.md"
license = "MIT"
repository = "https://github.com/lzpel/alphastell"
homepage = "https://github.com/lzpel/alphastell"
documentation = "https://docs.rs/alphastell"
keywords = ["stellarator", "fusion", "cad", "vmec", "nuclear"]
categories = ["science", "simulation", "command-line-utilities", "mathematics"]
exclude = [
	"/parastell",
	"/figure",
	"/notes",
	"/out",
	"/tools",
	"/examples",
	"/.github",
	"/.claude",
	"/.venv",
	"/pyproject.toml",
	"/uv.lock",
	"/makefile",
	"main.step",
	"main.svg",
]

[features]
frontend-embed = ["rust-embed", "mime_guess"]

[dependencies]
cadrum = "^0.8.0"
netcdf3 = "^0.6"
clap = { version = "^4", features = ["derive", "env"] }
regex = "^1"
# for server
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
axum = { version = "^0", features = ["multipart"] }
tokio = { version = "^1", features = ["rt", "rt-multi-thread", "macros", "signal", "net"] }
http = "^1"
tar = "^0.4"
gltf-json = { version = "^1", features = ["names", "extras", "extensions", "KHR_materials_unlit"] }
tower-http = { version = "^0.6", features = ["compression-gzip"] }
# frontend 埋め込み用 (frontend-embed feature ON 時のみ)
rust-embed = { version = "^8", optional=true }
mime_guess = { version = "^2", optional=true }
# frontend プロキシ用 (default、frontend-embed OFF 時のフォールバックとして dev frontend に転送)
axum-reverse-proxy = "^1.3"
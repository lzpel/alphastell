[workspace]
resolver = "2"
members = ["core", "cli", "web"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Satoshi Misumi"]
license = "MIT"
repository = "https://github.com/lzpel/alphastell"
homepage = "https://github.com/lzpel/alphastell"

[workspace.dependencies]
cadrum = "0.8.13"
netcdf3 = "^0.6"
regex = "^1"
clap = { version = "^4", features = ["derive", "env"] }

# wasm モジュールのサイズ最適化。native CLI のリリースビルドにも適用される。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

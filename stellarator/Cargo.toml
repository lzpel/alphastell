[package]
name = "stellarator"
version = "0.1.0"
edition = "2024"

# cdylib は python 拡張モジュール (maturin)、rlib は従来の cargo test / rust 利用者用
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
netcdf3 = "0.6"
# optional + feature ゲート: extension-module は libpython をリンクしないため、
# 通常ビルド (cargo test) に混ぜると壊れる。maturin だけが python feature を立てる
pyo3 = { version = "0.29.0", features = ["extension-module"], optional = true }

[features]
python = ["dep:pyo3"]
